name: astrbot_plugin_command_guard
display_name: 指令守卫
short_desc: 按全局设置与会话（UMO）规则忽略指定指令或非管理员指令，被忽略时静默不响应。
desc: 为 AstrBot 提供指令级访问控制：可设置全局的忽略非管理员、忽略指令清单与始终放行清单，并针对不同会话/UMO 单独开关与配置；管理员与机器人自身事件始终放行。被忽略的指令不会执行、不会回复，也不会触发 LLM，仅在日志中留下一条记录。
version: 2.0.0
author: cyilin
repo: https://github.com/cyilin36/astrbot_plugin_command_guard
astrbot_version: ">=4.25.0"
